name: Android APK

on:
  push:
    branches: ["main", "ccr-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Create debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      # Public repo: the OpenRouter key is never available here. The APK falls back to the key
      # entered in Settings (or an assets/openrouter.key injected after the build).
      - name: Build debug APK
        run: gradle assembleDebug --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: navio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as "latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: navio-latest
          name: Navio (son derleme)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: "Son derleme: ${{ github.sha }}. Ilk acilista Ayarlar'dan OpenRouter API anahtarini girin."
